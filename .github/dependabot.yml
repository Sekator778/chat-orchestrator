version: 2
updates:
  # Keep Maven dependencies up to date
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch minor and patch bumps into a single PR to reduce noise
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pinned versions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
