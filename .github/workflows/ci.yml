name: CI

on:
  push:
    # dev is the integration branch every PR merges into; main is the release
    # mainline it is promoted to, and the branch the atlas stand deploys from.
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least-privilege token: CI only reads code and reports a status check.
permissions:
  contents: read

# Cancel superseded runs on the same ref to avoid stale checks and wasted runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # Two Maven builds run here on main/dispatch: the linux `verify` gate and the
    # macOS/arm64 deploy jar. 15 minutes only covered the first one.
    timeout-minutes: 25

    env:
      # The deployable jar is published after a green verify on main - that is,
      # once dev has been promoted - and on a manual dispatch used to smoke-test
      # this workflow. dev is where work integrates and is gated by this same
      # workflow, but it publishes nothing: the stand deploys releases, not every
      # merged pull request. Pull requests build and test only.
      PUBLISH_DEPLOY_JAR: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin) with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Cache keyed on pom.xml hash; invalidates automatically when dependencies change.
          cache: maven

      - name: Build and run unit tests
        # Integration tests (*IntegrationTest, *EndToEndTest) require Docker-backed Postgres
        # and Kafka; they are already excluded by maven-surefire-plugin in pom.xml and do
        # NOT run in this workflow. Override the TDLight native classifier for the Linux runner.
        run: mvn -B -ntp verify -Dtdlight.native.classifier=linux_amd64_gnu_ssl3

      # --- deployable artifact for the atlas stand (macOS / Apple Silicon) ------
      # The TDLight natives are baked into the fat jar at build time, picked by
      # `tdlight.native.classifier`. The jar tested above therefore carries the
      # linux natives and can NOT run natively on the Mac. The deploy jar is a
      # separate build with the macOS classifier; the natives are an ordinary
      # Maven artifact, so cross-building them on ubuntu is fine.
      - name: Build deployable jar (macOS/arm64 natives)
        if: env.PUBLISH_DEPLOY_JAR == 'true'
        # `clean` is mandatory, not hygiene: maven-jar-plugin skips a jar that is
        # newer than target/classes, and spring-boot:repackage leaves an already
        # repackaged jar alone - without it the linux jar from `verify` would be
        # published unchanged under the macOS artifact name.
        run: mvn -B -ntp clean package -DskipTests -Dtdlight.native.classifier=macos_arm64

      - name: Assert the deploy jar carries the macOS/arm64 natives
        if: env.PUBLISH_DEPLOY_JAR == 'true'
        run: |
          jar=target/chat-orchestrator-1.0.0.jar
          test -f "$jar" || { echo "::error::$jar was not produced"; exit 1; }
          if ! unzip -l "$jar" | grep -q 'tdlight-natives-.*-macos_arm64\.jar'; then
            echo "::error::macos_arm64 natives are missing from $jar - it would not boot on the Mac"
            exit 1
          fi
          if unzip -l "$jar" | grep -q 'tdlight-natives-.*-linux_'; then
            echo "::error::linux natives leaked into the macOS deploy jar"
            exit 1
          fi
          echo "ok: $(unzip -l "$jar" | grep -o 'tdlight-natives-[^ ]*\.jar' | head -1)"

      - name: Upload deployable jar
        if: env.PUBLISH_DEPLOY_JAR == 'true'
        uses: actions/upload-artifact@v7
        with:
          # scripts/orch-deploy.sh resolves the artifact of the latest successful
          # run on main; the SHA in the name is what the stand records as deployed.
          name: app-jar-${{ github.sha }}
          path: target/chat-orchestrator-1.0.0.jar
          if-no-files-found: error
          # The stand only ever pulls the newest successful main run; a month of
          # history is plenty and keeps the artifact storage bounded.
          retention-days: 30
