name: gitleaks

# Secret-scan guard: blocks pushes/PRs that introduce credential-shaped strings.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
