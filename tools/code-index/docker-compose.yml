# Phase 0 - code vector index (semantic search over the repository).
# See the MultiAgent dev guide, section 6.9 ("Phase 0"), artifact 4.
#
# Qdrant runs as a long-lived service. The indexer is one-shot and is gated
# behind a profile so it does NOT start with a plain "docker compose up".
#
#   docker compose up -d qdrant                          # start the vector DB
#   docker compose --profile tools run --rm indexer      # (re)build the index
#   docker compose run --rm indexer python search.py "kafka retry backoff"
#
# Dashboard: http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:latest        # pin to a tag (e.g. v1.12.4) for reproducible builds
    container_name: tub-code-qdrant
    ports:
      - "6333:6333"                    # REST + dashboard
      - "6334:6334"                    # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  indexer:
    build: .
    profiles: ["tools"]
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: "http://qdrant:6333"
      REPO_PATH: "/repo"
      COLLECTION: "telegram_userbot_code"
      EMBED_MODEL: "BAAI/bge-small-en-v1.5"
    volumes:
      - ../..:/repo:ro                             # repository root, read-only
      - ./fastembed_cache:/root/.cache/fastembed   # cache the embedding model
    command: ["python", "index_repo.py"]
