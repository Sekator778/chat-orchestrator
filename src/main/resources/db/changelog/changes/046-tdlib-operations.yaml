databaseChangeLog:
  # =================================================================
  # TDLib Operations Coordination Table
  # =================================================================
  # Adds:
  # 1. tdlib_operations table for tracking TDLib state-modifying operations
  # 2. Distributed locking support for multi-instance coordination
  # 3. Indexes for efficient queries
  # =================================================================
  # Purpose: Prevent concurrent TDLib operations (like LoadChats) that can
  # corrupt the internal TDLib state machine and cause dialog date errors.
  # =================================================================

  - changeSet:
      id: 046-create-tdlib-operations-table
      author: dev-team
      comment: "Create tdlib_operations table for distributed operation locking"
      changes:
        - createTable:
            schemaName: bot
            tableName: tdlib_operations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: operation_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                  remarks: "Type of operation: CHAT_DISCOVERY, LOAD_CHATS_MAIN, LOAD_CHATS_ARCHIVE, MESSAGE_SYNC"
              - column:
                  name: bot_instance_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: "Bot instance that owns this operation"
              - column:
                  name: resource_id
                  type: VARCHAR(100)
                  remarks: "Optional resource identifier (e.g., chat_id for sync operations)"
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'IN_PROGRESS'
                  constraints:
                    nullable: false
                  remarks: "Operation status: IN_PROGRESS, COMPLETED, FAILED, TIMEOUT"
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
                  remarks: "When the operation started"
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "When the operation completed (null if still running)"
              - column:
                  name: timeout_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "When this operation should be considered stale"
              - column:
                  name: error_message
                  type: TEXT
                  remarks: "Error message if operation failed"
              - column:
                  name: details
                  type: JSONB
                  remarks: "Additional operation details (progress, stats, etc.)"
              - column:
                  name: heartbeat_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Last heartbeat timestamp for long-running operations"
        - sql:
            comment: "Add check constraint for valid status values"
            sql: |
              ALTER TABLE bot.tdlib_operations
              ADD CONSTRAINT chk_tdlib_operations_status
              CHECK (status IN ('IN_PROGRESS', 'COMPLETED', 'FAILED', 'TIMEOUT'));

  - changeSet:
      id: 046-create-tdlib-operations-indexes
      author: dev-team
      comment: "Create indexes for efficient operation queries"
      changes:
        # Index for finding in-progress operations by type
        - createIndex:
            schemaName: bot
            tableName: tdlib_operations
            indexName: idx_tdlib_operations_status_type
            columns:
              - column:
                  name: status
              - column:
                  name: operation_type
        # Index for finding operations by bot instance
        - createIndex:
            schemaName: bot
            tableName: tdlib_operations
            indexName: idx_tdlib_operations_bot_instance
            columns:
              - column:
                  name: bot_instance_id
              - column:
                  name: status
        # Index for cleanup of old operations
        - createIndex:
            schemaName: bot
            tableName: tdlib_operations
            indexName: idx_tdlib_operations_completed_at
            columns:
              - column:
                  name: completed_at
                  descending: true
        # Index for finding stale operations by timeout
        - createIndex:
            schemaName: bot
            tableName: tdlib_operations
            indexName: idx_tdlib_operations_timeout
            columns:
              - column:
                  name: timeout_at
            where: "status = 'IN_PROGRESS'"
        # Unique constraint to prevent duplicate concurrent operations of same type
        - createIndex:
            schemaName: bot
            tableName: tdlib_operations
            indexName: uq_tdlib_operations_active_type
            unique: true
            columns:
              - column:
                  name: operation_type
              - column:
                  name: bot_instance_id
            where: "status = 'IN_PROGRESS'"
