databaseChangeLog:
  - changeSet:
      id: 027-problematic-chats-table
      author: codex
      changes:
        - sql: |
            CREATE TABLE IF NOT EXISTS bot.problematic_chats (
                channel_chat_id        BIGINT PRIMARY KEY,
                reason                 VARCHAR(64) NOT NULL,
                details                TEXT,
                failure_count          INTEGER NOT NULL DEFAULT 1,
                first_detected_at      TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                last_detected_at       TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                last_attempted_at      TIMESTAMPTZ,
                notes                  TEXT
            );
            CREATE INDEX IF NOT EXISTS idx_problematic_chats_last_detected
                ON bot.problematic_chats(last_detected_at);
