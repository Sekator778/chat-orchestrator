databaseChangeLog:
  - changeSet:
      id: sync-001-create-sync-configurations
      author: dev-team
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: channels
            schemaName: tgscan
        - not:
            tableExists:
              tableName: sync_configurations
      changes:
        - createTable:
            tableName: sync_configurations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: default_sync_depth_days
                  type: INTEGER
              - column:
                  name: max_sync_depth_days
                  type: INTEGER
                  defaultValueNumeric: 365
              - column:
                  name: auto_sync_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: auto_sync_interval_days
                  type: INTEGER
                  defaultValueNumeric: 7
              - column:
                  name: last_auto_sync_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: max_concurrent_syncs
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: sync_configurations
            columnNames: channel_id
            constraintName: uq_sync_configurations_channel
        - addForeignKeyConstraint:
            baseTableName: sync_configurations
            baseColumnNames: channel_id
            referencedTableSchemaName: tgscan
            referencedTableName: channels
            referencedColumnNames: id
            constraintName: fk_sync_configurations_channel
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: sync_configurations

  - changeSet:
      id: sync-002-create-sync-jobs
      author: dev-team
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: channels
            schemaName: tgscan
        - not:
            tableExists:
              tableName: sync_jobs
      changes:
        - createTable:
            tableName: sync_jobs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
              - column:
                  name: sync_depth_days
                  type: INTEGER
              - column:
                  name: sync_from_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: sync_to_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: messages_processed
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: messages_total
                  type: BIGINT
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by_user_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: sync_jobs
            baseColumnNames: channel_id
            referencedTableSchemaName: tgscan
            referencedTableName: channels
            referencedColumnNames: id
            constraintName: fk_sync_jobs_channel
            onDelete: CASCADE
        - createIndex:
            tableName: sync_jobs
            indexName: idx_sync_jobs_channel_created_at
            columns:
              - column:
                  name: channel_id
              - column:
                  name: created_at
        - createIndex:
            tableName: sync_jobs
            indexName: idx_sync_jobs_status_completed_at
            columns:
              - column:
                  name: status
              - column:
                  name: completed_at
        - createIndex:
            tableName: sync_jobs
            indexName: idx_sync_jobs_created_by
            columns:
              - column:
                  name: created_by_user_id
      rollback:
        - dropTable:
            tableName: sync_jobs

  - changeSet:
      id: sync-003-link-messages-to-sync-jobs
      author: dev-team
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: messages
        - tableExists:
            tableName: sync_jobs
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_messages_sync_job
      changes:
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: sync_job_id
            referencedTableName: sync_jobs
            referencedColumnNames: id
            constraintName: fk_messages_sync_job
            onDelete: SET NULL
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_sync_job
