databaseChangeLog:
  - changeSet:
      id: 050-digest-publish-mode
      author: dev
      changes:
        - sql:
            sql: |
              ALTER TABLE bot.digest_personas
                ADD COLUMN IF NOT EXISTS publish_mode VARCHAR(20) NOT NULL DEFAULT 'DIGEST',
                ADD COLUMN IF NOT EXISTS random_delay_max_minutes INTEGER NOT NULL DEFAULT 0;

              ALTER TABLE bot.digest_personas
                DROP CONSTRAINT IF EXISTS chk_digest_publish_mode;

              ALTER TABLE bot.digest_personas
                ADD CONSTRAINT chk_digest_publish_mode
                CHECK (publish_mode IN ('DIGEST', 'OPINION_POST'));
