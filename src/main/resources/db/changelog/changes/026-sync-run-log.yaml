databaseChangeLog:
  - changeSet:
      id: sync-026-sync-run-log
      author: codex
      preConditions:
        - onFail: HALT
        - not:
            tableExists:
              schemaName: bot
              tableName: sync_run_log
      changes:
        - createTable:
            schemaName: bot
            tableName: sync_run_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: run_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: channels_populated
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: chats_discovered
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: configs_created
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: sync_jobs_started
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: details
                  type: JSONB
        - createIndex:
            schemaName: bot
            tableName: sync_run_log
            indexName: idx_sync_run_log_started_at
            columns:
              - column:
                  name: started_at
      rollback:
        - dropTable:
            schemaName: bot
            tableName: sync_run_log
