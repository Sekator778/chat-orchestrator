databaseChangeLog:
  - changeSet:
      id: 049-create-persona-reaction-config
      author: dev
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS bot.persona_reaction_config (
                  id              BIGSERIAL PRIMARY KEY,
                  persona_id      VARCHAR(64)   NOT NULL,
                  channel_id      BIGINT        NOT NULL,
                  max_per_day     INTEGER       NOT NULL DEFAULT 2,
                  enabled         BOOLEAN       NOT NULL DEFAULT TRUE,
                  created_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
                  updated_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_reaction_config_persona_channel UNIQUE (persona_id, channel_id)
              );
              CREATE INDEX IF NOT EXISTS idx_reaction_config_persona
                  ON bot.persona_reaction_config(persona_id) WHERE enabled = TRUE;

  - changeSet:
      id: 049-create-persona-reaction-log
      author: dev
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS bot.persona_reaction_log (
                  id              BIGSERIAL PRIMARY KEY,
                  persona_id      VARCHAR(64)   NOT NULL,
                  channel_id      BIGINT        NOT NULL,
                  message_id      BIGINT        NOT NULL,
                  reaction_emoji  VARCHAR(16)   NOT NULL,
                  scheduled_at    TIMESTAMP WITH TIME ZONE NOT NULL,
                  executed_at     TIMESTAMP WITH TIME ZONE,
                  status          VARCHAR(20)   NOT NULL DEFAULT 'PENDING',
                  error_message   TEXT,
                  attempt_count   INTEGER       NOT NULL DEFAULT 0,
                  created_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
                  CONSTRAINT chk_reaction_status CHECK (status IN ('PENDING','DONE','FAILED','SKIPPED','FLOOD_WAIT'))
              );
              CREATE INDEX IF NOT EXISTS idx_reaction_log_pending
                  ON bot.persona_reaction_log(status, scheduled_at) WHERE status = 'PENDING';
              CREATE INDEX IF NOT EXISTS idx_reaction_log_persona_daily
                  ON bot.persona_reaction_log(persona_id, created_at);
              CREATE INDEX IF NOT EXISTS idx_reaction_log_persona_channel_daily
                  ON bot.persona_reaction_log(persona_id, channel_id, created_at);
              CREATE UNIQUE INDEX IF NOT EXISTS uq_reaction_log_persona_message
                  ON bot.persona_reaction_log(persona_id, channel_id, message_id);
