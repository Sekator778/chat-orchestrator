databaseChangeLog:
  - changeSet:
      id: core-002-create-users
      author: dev-team
      preConditions:
        - onFail: HALT
        - not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: telegram_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: preferred_name
                  type: VARCHAR(255)
              - column:
                  name: preferred_title
                  type: VARCHAR(100)
              - column:
                  name: communication_style
                  type: VARCHAR(50)
                  defaultValue: 'CASUAL'
              - column:
                  name: personality_traits
                  type: TEXT
              - column:
                  name: relationship_context
                  type: TEXT
              - column:
                  name: language_preference
                  type: VARCHAR(10)
                  defaultValue: 'uk'
              - column:
                  name: response_length
                  type: VARCHAR(50)
                  defaultValue: 'MEDIUM'
              - column:
                  name: ai_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_interaction_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: users
            columnNames: telegram_user_id
            constraintName: uq_users_telegram_id
      rollback:
        - dropTable:
            tableName: users