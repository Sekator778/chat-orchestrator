databaseChangeLog:
  - changeSet:
      id: pending-001-create-pending-responses-table
      author: dev-team
      preConditions:
        - onFail: HALT
        - not:
            tableExists:
              tableName: pending_responses
              schemaName: bot
      changes:
        - createTable:
            tableName: pending_responses
            schemaName: bot
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: triggering_message_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: prepared_response
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: response_intent
                  type: VARCHAR(50)
              - column:
                  name: response_tone
                  type: VARCHAR(50)
              - column:
                  name: response_length
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
              - column:
                  name: required_human_replies
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: current_human_replies
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: eligible_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: pending_responses
            schemaName: bot
            indexName: idx_pending_responses_chat_status
            columns:
              - column:
                  name: chat_id
              - column:
                  name: status
        - createIndex:
            tableName: pending_responses
            schemaName: bot
            indexName: idx_pending_responses_status_eligible
            columns:
              - column:
                  name: status
              - column:
                  name: eligible_at
        - createIndex:
            tableName: pending_responses
            schemaName: bot
            indexName: idx_pending_responses_expires_at
            columns:
              - column:
                  name: expires_at
        - addForeignKeyConstraint:
            baseTableName: pending_responses
            baseTableSchemaName: bot
            baseColumnNames: chat_id
            referencedTableSchemaName: tgscan
            referencedTableName: channels
            referencedColumnNames: id
            constraintName: fk_pending_responses_chat
            onDelete: CASCADE

  - changeSet:
      id: pending-002-add-wait-for-replies-to-chat-configs
      author: dev-team
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: chat_configs
            schemaName: bot
        - not:
            columnExists:
              tableName: chat_configs
              schemaName: bot
              columnName: wait_for_human_replies_count
      changes:
        - addColumn:
            tableName: chat_configs
            schemaName: bot
            columns:
              - column:
                  name: wait_for_human_replies_count
                  type: INTEGER
                  defaultValueNumeric: -1
                  constraints:
                    nullable: false
                  remarks: "Number of human replies to wait for before sending queued response. -1 means send immediately (current behavior)"
        - rollback:
            - dropColumn:
                tableName: chat_configs
                schemaName: bot
                columnName: wait_for_human_replies_count

  - changeSet:
      id: pending-003-add-primary-channel-checked-at
      author: dev-team
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: chat_configs
            schemaName: bot
        - not:
            columnExists:
              tableName: chat_configs
              schemaName: bot
              columnName: primary_channel_checked_at
      changes:
        - addColumn:
            tableName: chat_configs
            schemaName: bot
            columns:
              - column:
                  name: primary_channel_checked_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Last time the primary channel was checked for new forwards"
