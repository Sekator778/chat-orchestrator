databaseChangeLog:
  - changeSet:
      id: 051-pipeline-observability
      author: dev
      changes:
        - sql:
            sql: |
              -- View: quick snapshot of pipeline health (adapted to actual schema)
              CREATE OR REPLACE VIEW bot.pipeline_health AS
              SELECT
                (SELECT COUNT(*)
                   FROM bot.messages
                  WHERE created_at > NOW() - INTERVAL '1 hour') AS messages_last_hour,
                (SELECT COUNT(*)
                   FROM bot.messages
                  WHERE importance > 0
                    AND created_at > NOW() - INTERVAL '6 hours') AS scored_messages_fresh,
                (SELECT MAX(importance)
                   FROM bot.messages
                  WHERE created_at > NOW() - INTERVAL '24 hours') AS top_score,
                (SELECT MIN(importance)
                   FROM bot.messages
                  WHERE importance > 0
                    AND created_at > NOW() - INTERVAL '24 hours') AS min_nonzero_score,
                (SELECT COUNT(*)
                   FROM bot.digest_history
                  WHERE published_at > NOW() - INTERVAL '24 hours'
                    AND status = 'PUBLISHED') AS published_today,
                (SELECT COUNT(DISTINCT persona_id)
                   FROM bot.digest_history
                  WHERE published_at > NOW() - INTERVAL '24 hours'
                    AND status = 'PUBLISHED') AS personas_published_today;

              -- Table: time-series pipeline health snapshots (6-hour cadence)
              CREATE TABLE IF NOT EXISTS bot.pipeline_snapshots (
                id                   BIGSERIAL PRIMARY KEY,
                snapshotted_at       TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
                period_hours         INTEGER NOT NULL DEFAULT 6,
                messages_ingested    BIGINT NOT NULL DEFAULT 0,
                scored_fresh         BIGINT NOT NULL DEFAULT 0,
                top_score            DOUBLE PRECISION,
                min_nonzero_score    DOUBLE PRECISION,
                published_today      BIGINT NOT NULL DEFAULT 0,
                personas_published   INTEGER NOT NULL DEFAULT 0,
                top_messages_preview TEXT,
                anomaly              BOOLEAN NOT NULL DEFAULT FALSE,
                anomaly_reasons      TEXT[]
              );

              CREATE INDEX IF NOT EXISTS idx_pipeline_snapshots_at
                ON bot.pipeline_snapshots (snapshotted_at DESC);
